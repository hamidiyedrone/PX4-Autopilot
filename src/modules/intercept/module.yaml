module_name: Intercept

parameters:
    - group: Intercept
      definitions:
        INT_ENABLE:
            description:
                short: Enable intercept flight mode
                long: Enables the target intercept autonomous flight mode.
            type: boolean
            default: 1

        INT_STANDOFF:
            description:
                short: Desired terminal standoff distance
                long: Horizontal distance in meters to maintain behind target during close pursuit.
            type: float
            default: 5.0
            min: 1.0
            max: 10.0
            decimal: 1

        INT_LOST_TOUT:
            description:
                short: Visual contact loss timeout
                long: Time in seconds to steer towards target position and re-acquire visual before reverting to approach.
            type: float
            default: 2.0
            min: 0.5
            max: 10.0
            decimal: 1

        INT_APP_MIN_VEL:
            description:
                short: Minimum closing speed in approach guidance
                long: Minimum relative closing speed (m/s) maintained in midcourse position approach guidance.
            type: float
            default: 6.0
            min: 2.0
            max: 15.0
            decimal: 1

        INT_APP_KP_Z:
            description:
                short: Approach mode altitude tracking proportional gain
                long: Proportional gain (m/s per meter altitude error) for midcourse approach altitude tracking.
            type: float
            default: 0.8
            min: 0.1
            max: 3.0
            decimal: 2

        INT_APP_YAWRATE:
            description:
                short: Maximum heading slew rate in approach
                long: Maximum heading change rate (deg/s) in midcourse approach guidance.
            type: float
            default: 42.0
            min: 5.0
            max: 90.0
            decimal: 1

        INT_TRM_KP_FWD:
            description:
                short: Terminal standoff distance error velocity gain
                long: Proportional speed gain commanding forward pursuit speed offset from horizontal distance error.
            type: float
            default: 12.0
            min: 0.5
            max: 15.0
            decimal: 1

        INT_TRM_KD_FWD:
            description:
                short: Terminal relative closing speed damping gain
                long: Derivative damping gain on optical relative closing speed (m/s) matching target velocity.
            type: float
            default: 7.5
            min: 0.1
            max: 10.0
            decimal: 2

        INT_TRM_FWD_TOL:
            description:
                short: Terminal forward distance tracking deadband tolerance
                long: Distance tolerance (+/- meters) around desired standoff in close pursuit to maintain speed match without hunting.
            type: float
            default: 1.0
            min: 0.05
            max: 1.0
            decimal: 2

        INT_TRM_YAW_TOL:
            description:
                short: Terminal yaw optical tracking deadband tolerance
                long: Optical screen error tolerance (+/- from center 0.50) for yaw tracking to suppress chattering and fishtailing.
            type: float
            default: 0.02
            min: 0.005
            max: 0.15
            decimal: 3

        INT_TRM_BRK_LAT:
            description:
                short: Terminal lateral cornering brake speed reduction
                long: Maximum forward speed reduction (m/s) when target shifts laterally off-boresight in close pursuit.
            type: float
            default: 1.5
            min: 0.0
            max: 10.0
            decimal: 1

        INT_TRM_BRK_TOL:
            description:
                short: Terminal corner braking deadband tolerance
                long: Lateral screen offset deadband (+/- from center 0.50) before corner braking activates. 0.25 gives corridor [0.25, 0.75].
            type: float
            default: 0.20
            min: 0.05
            max: 0.45
            decimal: 2

        INT_TRM_KP_Z:
            description:
                short: Terminal altitude tracking proportional gain
                long: Proportional gain (m/s per meter altitude error) for terminal standoff altitude tracking.
            type: float
            default: 0.6
            min: 0.1
            max: 5.0
            decimal: 2

        INT_TRM_Z_TOL:
            description:
                short: Terminal altitude tracking deadband tolerance
                long: Altitude deadband tolerance (+/- meters) in close pursuit to prevent optical pitch oscillations.
            type: float
            default: 0.3
            min: 0.05
            max: 1.0
            decimal: 2

        INT_TRM_ACC_Z:
            description:
                short: Terminal close pursuit vertical acceleration limit
                long: Maximum vertical acceleration (m/s^2) in close pursuit to prevent pitch oscillations.
            type: float
            default: 1.2
            min: 0.2
            max: 5.0
            decimal: 1

        INT_TRM_YAWRATE:
            description:
                short: Terminal maximum heading slew rate
                long: Maximum heading change rate (deg/s) in terminal close pursuit to eliminate yaw hunting.
            type: float
            default: 18.0
            min: 5.0
            max: 60.0
            decimal: 1

        INT_TRM_TC_GAIN:
            description:
                short: Terminal turn coordinator roll-to-yaw feedback gain
                long: Turn coordinator gain feeding back vehicle roll angle into yaw guidance to assist turn entry and actively drive steady-state roll back to zero.
            type: float
            default: 0.0
            min: 0.0
            max: 1.5
            decimal: 2

        INT_TURRET_PITCH:
            description:
                short: Net gun turret pitch elevation angle
                long: Net launcher turret elevation angle in degrees.
            type: float
            default: 0.0
            min: 0.0
            max: 90.0
            unit: deg
            decimal: 1

        INT_GMB_SERVO:
            description:
                short: Gimbal pitch servo output index (1-8, 0=disabled)
            type: int32
            default: 1
            min: 0
            max: 8

        INT_TRT_SERVO:
            description:
                short: Turret pitch servo output index (1-8, 0=disabled)
            type: int32
            default: 2
            min: 0
            max: 8

        INT_TRG_SERVO:
            description:
                short: Net trigger servo output index (1-8, 0=disabled)
            type: int32
            default: 3
            min: 0
            max: 8

        INT_TRT_MIN_P:
            description:
                short: Turret minimum pitch angle
            type: float
            default: 0.0
            min: -30.0
            max: 90.0
            unit: deg
            decimal: 1

        INT_TRT_MAX_P:
            description:
                short: Turret maximum pitch angle
            type: float
            default: 45.0
            min: 0.0
            max: 90.0
            unit: deg
            decimal: 1

        INT_GMB_MIN_P:
            description:
                short: Gimbal minimum pitch angle
            type: float
            default: -60.0
            min: -90.0
            max: 0.0
            unit: deg
            decimal: 1

        INT_GMB_MAX_P:
            description:
                short: Gimbal maximum pitch angle
            type: float
            default: 60.0
            min: 0.0
            max: 90.0
            unit: deg
            decimal: 1

        INT_GMB_KP:
            description:
                short: Gimbal pitch PI tracking controller proportional gain
            type: float
            default: 60.0
            min: 0.0
            max: 200.0
            decimal: 1

        INT_GMB_KI:
            description:
                short: Gimbal pitch PI tracking controller integral gain
            type: float
            default: 10.0
            min: 0.0
            max: 50.0
            decimal: 1

        INT_TRT_MODE:
            description:
                short: Turret control mode (0=Manual, 1=Auto-Aim)
            type: int32
            default: 1
            min: 0
            max: 1

        INT_TRT_OFFSET:
            description:
                short: Turret pitch offset relative to gimbal pitch angle
                long: Angular offset in degrees added directly to gimbal pitch to determine turret aim angle (+/- deg).
            type: float
            default: 0.0
            min: -45.0
            max: 45.0
            unit: deg
            decimal: 1

        INT_AUTO_FIRE:
            description:
                short: Auto-fire net when in range and aimed (0=Off, 1=On)
            type: int32
            default: 0
            min: 0
            max: 1

        INT_FIRE_DIST:
            description:
                short: Auto-fire effective distance threshold
            type: float
            default: 20.0
            min: 5.0
            max: 40.0
            unit: m
            decimal: 1

        INT_FIRE_TOL:
            description:
                short: Auto-fire angular aim tolerance
            type: float
            default: 3.0
            min: 0.5
            max: 15.0
            unit: deg
            decimal: 1

        INT_TRG_PULSE:
            description:
                short: Net trigger servo pulse duration before auto-reset to safe
            type: float
            default: 0.5
            min: 0.1
            max: 3.0
            unit: s
            decimal: 2

        INT_TRIGGER:
            description:
                short: Manual trigger command parameter (1=Fire net)
            type: int32
            default: 0
            min: 0
            max: 1

