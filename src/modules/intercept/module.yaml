module_name: Intercept

parameters:
    - group: Intercept
      definitions:
        INT_ENABLE:
            description:
                short: Enable intercept flight mode
                long: Enables the target intercept autonomous flight mode.
            type: boolean
            default: 1

        INT_MIN_CLOSING:
            description:
                short: Minimum closing speed in position guidance
                long: Minimum relative closing speed (m/s) maintained in midcourse lead-pursuit approach guidance.
            type: float
            default: 5.0
            min: 1.0
            max: 15.0
            decimal: 1

        INT_BASKET_D:
            description:
                short: Capture basket offset behind target
                long: Distance in meters behind target flight line for virtual capture basket.
            type: float
            default: 2.5
            min: 1.0
            max: 10.0
            decimal: 1

        INT_KP_Z_APP:
            description:
                short: Approach mode altitude tracking proportional gain
                long: Proportional gain (m/s per meter altitude error) for midcourse approach altitude tracking.
            type: float
            default: 0.8
            min: 0.1
            max: 3.0
            decimal: 2

        INT_YAW_RATE:
            description:
                short: Maximum heading slew rate
                long: Maximum heading change rate (deg/s) in intercept pursuit guidance.
            type: float
            default: 45.0
            min: 5.0
            max: 90.0
            decimal: 1

        INT_APN_N:
            description:
                short: APN Navigation Constant N
                long: Proportional navigation gain N for 3D APN guidance law.
            type: float
            default: 3.8
            min: 2.0
            max: 6.0
            decimal: 2

        INT_ACC_MAX:
            description:
                short: Maximum guidance acceleration command
                long: Maximum acceleration norm in m/s^2 for trajectory setpoint saturation.
            type: float
            default: 45.0
            min: 10.0
            max: 80.0
            decimal: 1
