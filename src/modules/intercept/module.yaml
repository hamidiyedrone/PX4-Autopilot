module_name: Intercept

parameters:
    - group: Intercept
      definitions:
        INT_ENABLE:
            description:
                short: Enable intercept flight mode
                long: Enables the target intercept autonomous flight mode.
            type: boolean
            default: 1

        INT_APN_N:
            description:
                short: APN Navigation Constant N
                long: Proportional navigation gain N for 3D APN guidance law.
            type: float
            default: 3.8
            min: 2.0
            max: 6.0
            decimal: 2

        INT_BASKET_D:
            description:
                short: Capture basket offset behind target
                long: Distance in meters behind target flight line for virtual capture basket.
            type: float
            default: 2.5
            min: 1.0
            max: 10.0
            decimal: 1

        INT_ACC_MAX:
            description:
                short: Maximum guidance acceleration command
                long: Maximum acceleration norm in m/s^2 for trajectory setpoint saturation.
            type: float
            default: 55.0
            min: 10.0
            max: 80.0
            decimal: 1
